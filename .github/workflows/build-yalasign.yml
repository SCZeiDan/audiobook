name: build-yalasign

on:
  push:
    branches: [main]
    paths:
      - "yalasign/**"
      - ".github/workflows/build-yalasign.yml"
    tags: ["yalasign-v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: yalasign
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            yalasign/target
          key: ${{ runner.os }}-yalasign-${{ hashFiles('yalasign/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-yalasign-

      - name: Build
        run: cargo build --release 2>&1 | Tee-Object -FilePath build.log
        shell: pwsh

      - name: Show errors
        if: failure()
        run: Select-String -Path build.log -Pattern "error\[|error:" -Context 0,8 | Select-Object -First 40
        shell: pwsh

      - name: Upload exe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yalasign-windows-x64
          path: yalasign/target/release/yalasign.exe

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yalasign-build-log
          path: yalasign/build.log
