name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild \
            -project AudiobookPlayer.xcodeproj \
            -scheme AudiobookPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AudiobookPlayer.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show compile errors
        if: failure()
        run: |
          set +e
          echo "::group::error"
          grep -n "error:" "$RUNNER_TEMP/build.log" | head -n 60
          echo "::endgroup::"
          echo "::error::编译失败，把上面 error 那几行贴回来就能定位"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/AudiobookPlayer.xcarchive/Products/Applications/AudiobookPlayer.app"
          if [ ! -d "$APP" ]; then
            echo "::error::找不到编译产物 $APP"
            tail -n 200 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          rm -f AudiobookPlayer-unsigned.ipa
          zip -qryX AudiobookPlayer-unsigned.ipa Payload
          ls -lh AudiobookPlayer-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AudiobookPlayer-unsigned-ipa
          path: ${{ runner.temp }}/AudiobookPlayer-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
